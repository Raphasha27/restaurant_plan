name: 🔄 Daily Security & Contribution Sync

on:
  schedule:
    - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Git
        run: |
          git config --global user.name "Github-Harden-Bot"
          git config --global user.email "bot@kirov-dynamics.com"

      - name: 🛡️ Run Local Security Audit
        run: |
          echo "Running local security audit..."
          date > last-security-check.txt

      - name: 🚀 Commit & Push Changes
        run: |
          git add last-security-check.txt
          git commit -m "chore: [automated] daily security sync and maintenance commit" || echo "No changes to commit"
          git push origin main || git push origin master
